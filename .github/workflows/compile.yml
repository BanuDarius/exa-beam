name: Automatic CI/CD

on:
    push:
        branches: [ "main", "master" ]
    pull_request:
        branches: [ "main", "master" ]

jobs:
    compile-check:
        runs-on: self-hosted
        
        steps:
          - name: Check program
            uses: actions/checkout@v4

          - name: Clean directory
            run: make clean || true

          - name: Compile
            run: |
                echo "Started automatic build."
                make -j$(nproc)